
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050b14;
  color: #b9efff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
header {
  width: 100%;
  padding: 25px;
  text-align: center;
  letter-spacing: 5px;
  border-bottom: 1px solid #164d69;
  color: #52dfff;
}
.status {
  margin-top: 45px;
  color: #58e6ff;
  letter-spacing: 3px;
  font-size: 13px;
}
.orb {
  margin: 65px auto 35px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 2px solid #39cfff;
  box-shadow: 0 0 25px #009dff, inset 0 0 35px #006b9e;
  display: grid;
  place-items: center;
  animation: pulse 3s infinite;
}
.orb span {
  font-size: 55px;
  color: #76eaff;
}
@keyframes pulse {
  50% { box-shadow: 0 0 55px #00aaff, inset 0 0 55px #0076aa; }
}
#response {
  text-align: center;
  padding: 20px;
  min-height: 70px;
  line-height: 1.6;
  color: #d4f7ff;
}
button {
  background: #082b40;
  border: 1px solid #42d9ff;
  color: #7deaff;
  border-radius: 30px;
  padding: 15px 25px;
  margin: 10px;
  font-size: 15px;
}
button:active { background: #125577; }
#chat {
  width: 90%;
  margin-top: 30px;
  display: flex;
}
input {
  flex: 1;
  min-width: 0;
  background: #0b1928;
  border: 1px solid #277b9b;
  color: white;
  padding: 14px;
  border-radius: 12px;
}
footer {
  margin-top: auto;
  padding: 30px;
  color: #557d91;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>
<body>
<header>J.A.R.V.I.S</header>
<div class="status" id="status">SYSTEM ONLINE</div>
<div class="orb"><span>J</span></div>
<div id="response">Good evening. I am JARVIS. How may I assist you?</div>
<button onclick="speak('Good evening. I am JARVIS. How may I assist you?')">INITIALIZE VOICE</button>
<div id="chat">
<input id="question" placeholder="Ask JARVIS anything...">
<button onclick="ask()">SEND</button>
</div>
<button onclick="listen()">🎙 SPEAK</button>
<footer>PERSONAL AI ASSISTANT • VERSION 1.0</footer>
<script>
function speak(message) {
  if (!('speechSynthesis' in window)) {
    alert('Voice output is not supported in this browser.');
    return;
  }
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = 'en-GB';
  voice.rate = 0.9;
  speechSynthesis.speak(voice);
}
function ask() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  document.getElementById('response').textContent =
    'I heard you say: ' + q + '. AI connection will be added in the next stage.';
  document.getElementById('question').value = '';
}
function listen() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Speech recognition is not supported in this browser.');
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-GB';
  recognition.onstart = () => document.getElementById('status').textContent = 'LISTENING...';
  recognition.onresult = (event) => {
    document.getElementById('question').value = event.results[0][0].transcript;
    ask();
  };
  recognition.onend = () => document.getElementById('status').textContent = 'SYSTEM ONLINE';
  recognition.start();
}
</script>
</body>
</html>
